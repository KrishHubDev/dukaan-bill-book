<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dukaan Bill Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;600;700&family=Hind+Vadodara:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a shop counter tool. Top bar with tabs, one working area per tab; billing is a two-column ledger (items | totals) that stacks on phones. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1b2220; --muted:#5d6965; --line:#dde2de;
  --accent:#0d6656; --accent-ink:#ffffff; --accent-soft:#e1efea;
  --due:#b42318; --due-soft:#fdecea; --warn:#8a5a00; --warn-soft:#fff3d1; --good:#1f7a4d; --good-soft:#e3f3ea;
  --font-display:"Baloo Bhai 2", "Hind Vadodara", system-ui, sans-serif;
  --font-body:"Hind Vadodara", "Noto Sans Gujarati", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --surface:#1a211f; --ink:#e6ece9; --muted:#9aa8a3; --line:#2b3532;
    --accent:#4fc3a7; --accent-ink:#06211b; --accent-soft:#163029;
    --due:#ff8b7d; --due-soft:#3a1c19; --warn:#f2c14e; --warn-soft:#352b12; --good:#6fd39b; --good-soft:#15301f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a211f; --ink:#e6ece9; --muted:#9aa8a3; --line:#2b3532;
  --accent:#4fc3a7; --accent-ink:#06211b; --accent-soft:#163029;
  --due:#ff8b7d; --due-soft:#3a1c19; --warn:#f2c14e; --warn-soft:#352b12; --good:#6fd39b; --good-soft:#15301f;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted);min-height:1.2em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.4rem;font-weight:700;color:var(--accent)}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--good)}
.sync.bad::before{background:var(--due)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:hover{color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],input[type=date],input[type=tel],input:not([type]),select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
a.btn{text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--due)}
.btn.small{padding:4px 10px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.icon-btn{border:none;background:none;cursor:pointer;color:var(--muted);font-size:1.2rem;line-height:1;padding:4px 8px;border-radius:6px}
.icon-btn:hover{color:var(--due);background:var(--due-soft)}
a.link{color:var(--accent)}

/* billing */
.bill-head{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(130px,1fr));gap:12px;align-items:start}
.billno{font-family:var(--font-display);font-size:1.3rem;font-weight:600;padding-top:2px}
.bill-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
table.items{min-width:620px}
table.items td{padding:4px 6px}
table.items input{padding:7px 8px}
table.items .idx{color:var(--muted);width:32px;font-variant-numeric:tabular-nums}
table.items .c-qty{width:90px}
table.items .c-unit{width:60px;color:var(--muted);font-size:.9rem}
table.items .c-rate{width:110px}
table.items .c-amt{width:120px;font-weight:600}
table.items tr.flag td{background:var(--warn-soft)}
.rowflag{font-size:.78rem;color:var(--warn);padding:2px 2px 0}
.totals{position:sticky;top:110px;display:flex;flex-direction:column;gap:10px}
.tline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.tline input,.tline select{width:130px;text-align:right}
.tline.grand{font-family:var(--font-display);font-size:1.6rem;font-weight:700;border-top:1px solid var(--line);padding-top:8px}
.tline.due b{color:var(--due)}
.actions{display:flex;flex-direction:column;gap:8px}
.actions .btn{justify-content:center}
.kbd{font-size:.78rem;color:var(--muted)}

/* suggestions */
#sugg{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:320px;overflow-y:auto;padding:4px}
#sugg[hidden]{display:none}
.sg{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;border-radius:6px;cursor:pointer}
.sg.on{background:var(--accent-soft)}
.sg .nm{font-weight:600}
.sg .gu{color:var(--muted);font-size:.9rem;margin-left:6px}
.sg .rt{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.sg.add{color:var(--accent);font-weight:500;border-top:1px dashed var(--line);border-radius:0 0 6px 6px}

/* pills & tiles */
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.due{background:var(--due-soft);color:var(--due)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.zero{background:var(--bg);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .v{font-family:var(--font-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile.due .v{color:var(--due)}
.bar{height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.clickable{cursor:pointer}
.clickable:hover td{background:var(--accent-soft)}
.empty{padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:none;background:var(--surface);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,15,13,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
#modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:12px;padding:20px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet.wide{max-width:820px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scan-img{max-width:100%;max-height:260px;object-fit:contain;border-radius:8px;border:1px solid var(--line);align-self:center}
.spinner{width:22px;height:22px;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);font-weight:500}
#toast.due{background:var(--due);color:#fff}
#toast[hidden]{display:none}

/* invoice paper (fixed colours: it is a printed document) */
.iv{background:#fff;color:#1b1b1b;border:1px solid #d9d9d9;border-radius:6px;padding:22px;font-family:"Hind Vadodara",system-ui,sans-serif;font-size:14px}
.iv-h{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #0d6656;padding-bottom:10px;flex-wrap:wrap}
.iv-h h2{font-family:"Baloo Bhai 2","Hind Vadodara",sans-serif;font-size:1.5rem;color:#0d6656;margin:0}
.iv-meta{text-align:right}
.iv-to{margin:12px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.iv table{width:100%;border-collapse:collapse}
.iv th{background:#eef5f2;color:#333;text-transform:none;letter-spacing:0;font-size:.85rem;padding:6px 8px;text-align:left;border-bottom:1px solid #ccc}
.iv td{padding:6px 8px;border-bottom:1px solid #eee}
.iv .n{text-align:right;font-variant-numeric:tabular-nums}
.iv-tot{margin-left:auto;width:min(300px,100%);margin-top:10px}
.iv-tot div{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.iv-tot .g{font-weight:700;font-size:1.15rem;border-top:1px solid #333;margin-top:4px;padding-top:6px}
.iv-foot{margin-top:18px;font-size:.85rem;color:#555;text-align:center}

@media print{
  body{background:#fff}
  .top,main,#toast,#sugg{display:none !important}
  #modal{position:static;background:none;padding:0;overflow:visible}
  #modal .sheet{box-shadow:none;padding:0;max-width:none}
  #modal .sheet > :not(.iv){display:none !important}
  .iv{border:0}
}
@media (max-width: 860px){
  .bill-grid{grid-template-columns:1fr}
  .totals{position:static}
  .bill-head{grid-template-columns:1fr 1fr}
  .bill-head .f-cust{grid-column:1 / -1}
}
@media (max-width: 420px){
  .grid2{grid-template-columns:1fr}
  .tline input,.tline select{width:110px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1 id="shop-title">Dukaan Bill Book</h1>
      <span class="sync" id="sync">Loading…</span>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#bill">New bill</a>
      <a href="#sales">Sales report</a>
      <a href="#dues">Customers &amp; dues</a>
      <a href="#products">Products</a>
      <a href="#settings">Settings</a>
    </nav>
  </div>
</header>
<main id="view"></main>
<div id="sugg" hidden role="listbox"></div>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="scan-file" accept="image/*" capture="environment" hidden>
<input type="file" id="restore-file" accept=".json,application/json" hidden>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const num = v => { if (v === null || v === undefined || v === "") return 0; const n = parseFloat(String(v).replace(/[^\d.\-]/g, "")); return isFinite(n) ? n : 0; };
const money = n => "₹" + r2(n).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const qtyFmt = n => { n = r2(n); return Number.isInteger(n) ? String(n) : String(n); };
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => dstr(new Date());
const nice = s => { if (!s) return ""; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-IN", {day: "numeric", month: "short", year: "numeric"}); };
const byName = (a, b) => (a.name || "").localeCompare(b.name || "");

const ICON_CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';

/* ---------- state & storage ---------- */
const DEFAULT_SETTINGS = {shopName: "", address: "", phone: "", gstin: "", prefix: "INV-", levels: ["Retail", "Wholesale"], footer: "Thank you! Visit again."};
const KIND = {p: "products", c: "customers", i: "invoices", y: "payments"};
const S = {products: {}, customers: {}, invoices: {}, payments: {}, settings: {...DEFAULT_SETTINGS}};
let col = null;           // cloud collection (per-user private)
let canDownload = false, sampleApi = null;
const LS_KEY = "dukaan-bill-book-v1";

function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({products: S.products, customers: S.customers, invoices: S.invoices, payments: S.payments, settings: S.settings})); } catch (e) {}
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY); if (!raw) return;
    const d = JSON.parse(raw);
    for (const k of Object.values(KIND)) S[k] = d[k] || {};
    S.settings = {...DEFAULT_SETTINGS, ...(d.settings || {})};
  } catch (e) {}
}
function setSync(text, cls) { const el = $("#sync"); el.textContent = text; el.className = "sync " + (cls || ""); }

async function put(kind, obj) {
  S[KIND[kind]][obj.id] = obj; saveLocal();
  if (col) {
    try { await col.doc(kind + "_" + obj.id).set({...obj, kind}); }
    catch (e) { toast("Couldn't save to your account (" + (e && e.code || "error") + "). Kept on this device for now.", "due"); }
  }
}
async function remove(kind, id) {
  delete S[KIND[kind]][id]; saveLocal();
  if (col) { try { await col.doc(kind + "_" + id).delete(); } catch (e) { toast("Couldn't delete from your account. Try again.", "due"); } }
}
async function putSettings() {
  saveLocal(); applyShopName();
  if (col) { try { await col.doc("settings").set({...S.settings}); } catch (e) { toast("Couldn't save settings to your account.", "due"); } }
}
function applySnap(snap) {
  const n = {products: {}, customers: {}, invoices: {}, payments: {}}; let st = null;
  for (const d of snap.docs) {
    const v = d.data(); if (!v) continue;
    if (d.id === "settings") { st = v; continue; }
    const k = KIND[v.kind]; if (k && v.id) n[k][v.id] = v;
  }
  Object.assign(S, n);
  S.settings = {...DEFAULT_SETTINGS, ...(st || {})};
  if (!Array.isArray(S.settings.levels) || !S.settings.levels.length) S.settings.levels = [...DEFAULT_SETTINGS.levels];
  saveLocal(); onDataChange();
}
function initStore() {
  canDownload = true;
  let ok = true; try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch (e) { ok = false; }
  loadLocal(); onDataChange();
  setSync(ok ? "Saved in this browser" : "Browser storage is blocked. Data will be lost on reload.", ok ? "ok" : "bad");
}

/* scanner settings live outside the backup so the API key is never exported */
const API_KEY_LS = "dukaan-scan-settings";
function scanCfg() { try { return {key: "", model: "claude-sonnet-5-5", ...JSON.parse(localStorage.getItem(API_KEY_LS) || "{}")}; } catch (e) { return {key: "", model: "claude-sonnet-5-5"}; } }
function saveScanCfg(c) { try { localStorage.setItem(API_KEY_LS, JSON.stringify(c)); } catch (e) {} }

/* ---------- domain ---------- */
const levels = () => S.settings.levels;
function priceFor(p, level) {
  if (!p) return 0;
  const pr = p.prices || {};
  if (pr[level] !== undefined && pr[level] !== "") return num(pr[level]);
  for (const l of levels()) if (pr[l] !== undefined && pr[l] !== "") return num(pr[l]);
  return 0;
}
function custDue(cid, excludeInvoiceId) {
  const c = S.customers[cid]; let d = num(c && c.opening);
  for (const i of Object.values(S.invoices)) if (i.customerId === cid && i.id !== excludeInvoiceId) d += num(i.total) - num(i.received);
  for (const p of Object.values(S.payments)) if (p.customerId === cid) d -= num(p.amount);
  return r2(d);
}
function nextNo() { let m = 0; for (const i of Object.values(S.invoices)) m = Math.max(m, num(i.no)); return m + 1; }
const invLabel = inv => (S.settings.prefix || "") + inv.no;
function findCustomerByName(name) { const q = name.trim().toLowerCase(); return Object.values(S.customers).find(c => c.name.trim().toLowerCase() === q); }
function duePill(v) {
  if (v > 0.004) return `<span class="pill due">${money(v)} due</span>`;
  if (v < -0.004) return `<span class="pill good">${money(-v)} advance</span>`;
  return `<span class="pill zero">Settled</span>`;
}

/* ---------- ui primitives ---------- */
let toastT;
function toast(msg, cls) { const t = $("#toast"); t.textContent = msg; t.className = cls || ""; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, cls === "due" ? 5000 : 2600); }
function openModal(html, wide) {
  const m = $("#modal"); m.innerHTML = `<div class="sheet ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false;
  const f = m.querySelector("[autofocus]"); if (f) setTimeout(() => f.focus(), 30);
  return m.firstElementChild;
}
function closeModal() { const m = $("#modal"); m.hidden = true; m.innerHTML = ""; }
$("#modal").addEventListener("mousedown", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden && $("#sugg").hidden) closeModal(); });
function askConfirm(msg, okLabel = "Delete") {
  return new Promise(res => {
    const s = openModal(`<h3>${esc(msg)}</h3><div class="row" style="justify-content:flex-end"><button class="btn" data-a="no">Cancel</button><button class="btn primary" data-a="yes" autofocus>${esc(okLabel)}</button></div>`);
    s.addEventListener("click", e => { const a = e.target.closest("[data-a]"); if (!a) return; closeModal(); res(a.dataset.a === "yes"); });
  });
}
function offerDownload(filename, data) {
  const ext = filename.split(".").pop().toLowerCase();
  const type = {csv: "text/csv", json: "application/json", html: "text/html"}[ext] || "application/octet-stream";
  const url = URL.createObjectURL(new Blob([data], {type: type + ";charset=utf-8"}));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into WhatsApp."); }
  catch (e) {
    openModal(`<h3>Copy this text</h3><textarea rows="12" id="cp" autofocus>${esc(text)}</textarea><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Close</button></div>`);
    setTimeout(() => { const t = $("#cp"); t && t.select(); }, 50);
  }
}
const csvCell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\n");

/* ---------- suggestion dropdown ---------- */
const SG = {input: null, items: [], idx: 0, source: null};
function sgOpen(input, source) { SG.input = input; SG.source = source; sgUpdate(); }
function sgUpdate() {
  const el = $("#sugg");
  if (!SG.input) return;
  SG.items = SG.source(SG.input.value);
  if (!SG.items.length) { el.hidden = true; return; }
  SG.idx = Math.min(SG.idx, SG.items.length - 1); if (SG.idx < 0) SG.idx = 0;
  el.innerHTML = SG.items.map((it, i) => `<div class="sg ${it.cls || ""} ${i === SG.idx ? "on" : ""}" data-i="${i}" role="option" aria-selected="${i === SG.idx}">${it.html}</div>`).join("");
  sgPlace(); el.hidden = false;
}
function sgPlace() {
  if (!SG.input) return;
  const r = SG.input.getBoundingClientRect(), el = $("#sugg");
  const w = Math.min(Math.max(r.width, 300), window.innerWidth - 16);
  el.style.width = w + "px";
  el.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + "px";
  el.style.top = (r.bottom + 4) + "px";
}
function sgClose() { $("#sugg").hidden = true; SG.input = null; SG.items = []; SG.idx = 0; }
function sgIsOpen(input) { return SG.input === input && !$("#sugg").hidden && SG.items.length > 0; }
function sgMove(d) { SG.idx = (SG.idx + d + SG.items.length) % SG.items.length; sgUpdate(); const on = $("#sugg .on"); on && on.scrollIntoView({block: "nearest"}); }
function sgPick(i) { const it = SG.items[i ?? SG.idx]; const inp = SG.input; sgClose(); if (it) it.pick(inp); }
$("#sugg").addEventListener("mousedown", e => { e.preventDefault(); const d = e.target.closest(".sg"); if (d) sgPick(+d.dataset.i); });
window.addEventListener("resize", sgPlace);
window.addEventListener("scroll", sgPlace, true);

function matchProducts(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const out = [];
  for (const p of Object.values(S.products)) {
    const n = (p.name || "").toLowerCase(), g = (p.gu || "").toLowerCase(), grp = (p.group || "").toLowerCase();
    let s = -1;
    if (n.startsWith(q) || g.startsWith(q)) s = 0;
    else if (n.split(/[\s(\-/]+/).some(w => w.startsWith(q)) || g.split(/\s+/).some(w => w.startsWith(q))) s = 1;
    else if (n.includes(q) || g.includes(q)) s = 2;
    else if (grp.includes(q)) s = 3;
    if (s >= 0) out.push({p, s});
  }
  return out.sort((a, b) => a.s - b.s || byName(a.p, b.p)).slice(0, 10).map(x => x.p);
}

/* =========================================================
   NEW BILL
   ========================================================= */
const blankRow = () => ({key: uid(), productId: null, name: "", qty: "", unit: "", rate: "", rateEdited: false, flag: ""});
function newDraft() { return {id: null, no: null, date: today(), customerId: null, customerName: "", level: levels()[0], rows: [blankRow()], discount: "", received: "", receivedTouched: false, mode: "Cash", note: ""}; }
let draft = newDraft();

function calc() {
  let sub = 0;
  for (const r of draft.rows) sub += num(r.qty) * num(r.rate);
  sub = r2(sub);
  const disc = r2(num(draft.discount));
  const total = r2(Math.max(0, sub - disc));
  const received = draft.receivedTouched ? r2(num(draft.received)) : (draft.mode === "Credit" ? 0 : total);
  return {sub, disc, total, received, balance: r2(total - received)};
}

function rowHTML(r, i) {
  const a = num(r.qty) * num(r.rate);
  return `<tr data-key="${r.key}" class="${r.flag ? "flag" : ""}">
    <td class="idx">${i + 1}</td>
    <td><input class="it-name" value="${esc(r.name)}" placeholder="${i === 0 ? "Type item name, e.g. sug or ખાં…" : "Add item…"}" autocomplete="off" aria-label="Item ${i + 1}">${r.flag ? `<div class="rowflag">${esc(r.flag)}</div>` : ""}</td>
    <td class="c-qty"><input class="it-qty num" inputmode="decimal" value="${esc(r.qty)}" aria-label="Count for item ${i + 1}"></td>
    <td class="c-unit">${esc(r.unit)}</td>
    <td class="c-rate"><input class="it-rate num" inputmode="decimal" value="${esc(r.rate)}" aria-label="Rate for item ${i + 1}"></td>
    <td class="c-amt num">${a ? money(a) : ""}</td>
    <td><button class="icon-btn rm" aria-label="Remove item ${i + 1}" title="Remove">×</button></td>
  </tr>`;
}

  </div>
  <div class="card bill-head">
    <div class="field f-cust"><label for="b-cust">Customer</label>
      <input id="b-cust" value="${esc(draft.customerName)}" placeholder="Type name or phone. Leave blank for a cash sale." autocomplete="off">
      <div class="hint" id="b-cust-info"></div></div>
    <div class="field"><label for="b-level">Price list</label>
      <select id="b-level">${levels().map(l => `<option ${l === draft.level ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>
    <div class="field"><label for="b-date">Date</label><input type="date" id="b-date" value="${esc(draft.date)}"></div>

  <div class="bill-grid">

      <div class="table-wrap"><table class="items">

    </div>

      <div class="tline"><span>Items</span><span id="t-count">0</span></div>

  renderRows();

function renderRows(focusKey, focusCls) {
  if (!draft.rows.length || draft.rows[draft.rows.length - 1].name) draft.rows.push(blankRow());
  $("#b-rows").innerHTML = draft.rows.map(rowHTML).join("");
  updateTotals();
  if (focusKey) { const el = $(`tr[data-key="${focusKey}"] .${focusCls || "it-name"}`); el && el.focus(); }
}
function refreshBillMeta() {
  if (!$("#b-no")) return;
  $("#b-no").textContent = (S.settings.prefix || "") + (draft.no ?? nextNo());
  const info = $("#b-cust-info");
  if (draft.customerId && S.customers[draft.customerId]) {
    const c = S.customers[draft.customerId];
    info.innerHTML = `${esc(c.phone || "No phone")} · ${esc(c.level || levels()[0])} price · ${duePill(custDue(c.id, draft.id))}`;
  } else if (draft.customerName.trim()) {
    info.textContent = "New customer. They will be added when you save.";
  } else info.textContent = "Cash sale (walk-in)";
  updateTotals();
}
function updateTotals() {
  if (!$("#t-sub")) return;
  const t = calc();
  $("#t-count").textContent = draft.rows.filter(r => r.name && num(r.qty) > 0).length;
  $("#t-sub").textContent = money(t.sub);
  $("#t-total").textContent = money(t.total);
  const rv = $("#t-recv"); if (document.activeElement !== rv) rv.value = draft.receivedTouched ? draft.received : t.received;
  $("#t-bal").textContent = money(t.balance);
  const hasCust = !!(draft.customerId || draft.customerName.trim());
  const prev = draft.customerId ? custDue(draft.customerId, draft.id) : 0;
  $("#t-prev-wrap").hidden = !hasCust; $("#t-new-wrap").hidden = !hasCust;
  $("#t-prev").textContent = money(prev);
  $("#t-new").textContent = money(prev + t.balance);
  for (const r of draft.rows) {
    const cell = $(`tr[data-key="${r.key}"] .c-amt`); if (cell) { const a = num(r.qty) * num(r.rate); cell.textContent = a ? money(a) : ""; }
  }
}
function repriceRows() {
  for (const r of draft.rows) if (r.productId && !r.rateEdited) { const p = S.products[r.productId]; if (p) r.rate = String(priceFor(p, draft.level)); }
}
function pickProduct(row, p) {
  row.productId = p.id; row.name = p.name; row.unit = p.unit || ""; row.rate = String(priceFor(p, draft.level)); row.rateEdited = false; row.flag = "";
  if (!num(row.qty)) row.qty = "1";
  renderRows(row.key, "it-qty");
  const q = $(`tr[data-key="${row.key}"] .it-qty`); q && q.select();
}
const rowOf = el => draft.rows.find(r => r.key === el.closest("tr").dataset.key);

function productSource(row) {
  return q => {
    const items = matchProducts(q).map(p => ({
      html: `<span><span class="nm">${esc(p.name)}</span>${p.gu ? `<span class="gu">${esc(p.gu)}</span>` : ""}</span><span class="rt">${money(priceFor(p, draft.level))}${p.unit ? " / " + esc(p.unit) : ""}</span>`,
      pick: () => pickProduct(row, p)
    }));
    if (q.trim()) items.push({cls: "add", html: `<span>+ Add “${esc(q.trim())}” to products</span>`, pick: () => productModal(null, q.trim(), p => pickProduct(row, p))});
    return items;
  };
}
function customerSource(q) {
  q = q.trim().toLowerCase();
  const list = Object.values(S.customers).filter(c => !q || c.name.toLowerCase().includes(q) || (c.phone || "").includes(q))
    .sort((a, b) => { const as = a.name.toLowerCase().startsWith(q) ? 0 : 1, bs = b.name.toLowerCase().startsWith(q) ? 0 : 1; return as - bs || byName(a, b); }).slice(0, 8);
  const items = list.map(c => ({html: `<span><span class="nm">${esc(c.name)}</span><span class="gu">${esc(c.phone || "")}</span></span><span class="rt">${duePill(custDue(c.id, draft.id))}</span>`, pick: () => pickCustomer(c)}));
  if (q && !findCustomerByName(q)) items.push({cls: "add", html: `<span>+ New customer “${esc(q)}” (add phone and price list)</span>`, pick: inp => customerModal(null, inp.value.trim(), c => pickCustomer(c))});
  return items;
}
function pickCustomer(c) {
  draft.customerId = c.id; draft.customerName = c.name;
  if (c.level && levels().includes(c.level)) { draft.level = c.level; $("#b-level").value = c.level; repriceRows(); renderRows(); }
  $("#b-cust").value = c.name; refreshBillMeta();
  const first = draft.rows.find(r => !r.name); const el = first && $(`tr[data-key="${first.key}"] .it-name`); el && el.focus();
}

function wireBill() {
  const cust = $("#b-cust");
  cust.addEventListener("input", () => { draft.customerName = cust.value; draft.customerId = null; const m = findCustomerByName(cust.value); if (m) draft.customerId = m.id; refreshBillMeta(); sgOpen(cust, customerSource); });
  cust.addEventListener("focus", () => sgOpen(cust, customerSource));
  cust.addEventListener("blur", () => setTimeout(() => { if (SG.input === cust) sgClose(); }, 150));
  cust.addEventListener("keydown", e => keyNav(e, cust, () => { const f = draft.rows.find(r => !r.name); const el = f && $(`tr[data-key="${f.key}"] .it-name`); el && el.focus(); }));

  $("#b-level").addEventListener("change", e => { draft.level = e.target.value; repriceRows(); renderRows(); });
  $("#b-date").addEventListener("change", e => draft.date = e.target.value || today());
  $("#t-disc").addEventListener("input", e => { draft.discount = e.target.value; updateTotals(); });
  $("#t-mode").addEventListener("change", e => { draft.mode = e.target.value; draft.receivedTouched = false; updateTotals(); });
  $("#t-recv").addEventListener("input", e => { draft.received = e.target.value; draft.receivedTouched = true; updateTotals(); });
  $("#t-note").addEventListener("input", e => draft.note = e.target.value);
  $("#b-save").addEventListener("click", () => saveBill(false));
  $("#b-save-share").addEventListener("click", () => saveBill(true));
  $("#b-clear").addEventListener("click", async () => {
    if (draft.rows.some(r => r.name) && !draft.id && !(await askConfirm("Clear this bill? Items you've added will be removed.", "Clear bill"))) return;
    draft = newDraft(); renderBill();
  });
  $("#b-scan").addEventListener("click", startScan);

  const tb = $("#b-rows");
  tb.addEventListener("focusin", e => {
    if (e.target.classList.contains("it-name") && e.target.value.trim()) { const r = rowOf(e.target); sgOpen(e.target, productSource(r)); }
  });
  tb.addEventListener("focusout", e => { if (e.target.classList.contains("it-name")) { const t = e.target; setTimeout(() => { if (SG.input === t) sgClose(); }, 150); } });
  tb.addEventListener("input", e => {
    const t = e.target, r = rowOf(t); if (!r) return;
    if (t.classList.contains("it-name")) {
      r.name = t.value; r.productId = null; r.flag = "";
      const tr = t.closest("tr"); tr.classList.remove("flag"); const f = tr.querySelector(".rowflag"); f && f.remove();
      sgOpen(t, productSource(r));
      if (t.value && draft.rows[draft.rows.length - 1] === r) { draft.rows.push(blankRow()); tb.insertAdjacentHTML("beforeend", rowHTML(draft.rows[draft.rows.length - 1], draft.rows.length - 1)); }
    } else if (t.classList.contains("it-qty")) { r.qty = t.value; updateTotals(); }
    else if (t.classList.contains("it-rate")) { r.rate = t.value; r.rateEdited = true; if (num(t.value) > 0 && r.flag) { r.flag = ""; t.closest("tr").classList.remove("flag"); const f = t.closest("tr").querySelector(".rowflag"); f && f.remove(); } updateTotals(); }
  });
  tb.addEventListener("keydown", e => {
    const t = e.target, r = rowOf(t); if (!r) return;
    if (t.classList.contains("it-name")) {
      keyNav(e, t, () => { if (r.name) { const q = $(`tr[data-key="${r.key}"] .it-qty`); q && (q.focus(), q.select()); } });
    } else if (e.key === "Enter" && (t.classList.contains("it-qty") || t.classList.contains("it-rate"))) {
      e.preventDefault();
      if (t.classList.contains("it-qty") && !num(r.rate)) { const rt = t.closest("tr").querySelector(".it-rate"); rt.focus(); rt.select(); return; }
      const i = draft.rows.indexOf(r); const nx = draft.rows[i + 1];
      if (nx) { const el = $(`tr[data-key="${nx.key}"] .it-name`); el && el.focus(); }
    }
  });
  tb.addEventListener("click", e => {
    const b = e.target.closest(".rm"); if (!b) return;
    const r = rowOf(b); draft.rows = draft.rows.filter(x => x !== r); renderRows();
  });
}
function keyNav(e, input, onEnterNoList) {
  const open = sgIsOpen(input);
  if (e.key === "ArrowDown" && open) { e.preventDefault(); sgMove(1); }
  else if (e.key === "ArrowUp" && open) { e.preventDefault(); sgMove(-1); }
  else if (e.key === "Enter") { e.preventDefault(); if (open) sgPick(); else onEnterNoList(); }
  else if (e.key === "Escape" && open) { e.preventDefault(); sgClose(); }
  else if (e.key === "Tab" && open && input.classList.contains("it-name") && input.value.trim()) { const it = SG.items[SG.idx]; if (it && it.cls !== "add") { e.preventDefault(); sgPick(); } }
}
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && route() === "bill" && $("#modal").hidden) { e.preventDefault(); saveBill(false); }
});

async function saveBill(share) {
  sgClose();
  const rows = draft.rows.filter(r => r.name.trim());
  if (!rows.length) { toast("Add at least one item to the bill.", "due"); return; }
  for (const r of rows) {
    if (!(num(r.qty) > 0)) { toast(`Enter a count for “${r.name}”.`, "due"); focusRow(r, "it-qty"); return; }
    if (!(num(r.rate) > 0)) { toast(`Enter a rate for “${r.name}”.`, "due"); focusRow(r, "it-rate"); return; }
  }
  const t = calc();
  let cid = draft.customerId;
  const cname = draft.customerName.trim();
  if (!cid && !cname && t.balance > 0.004) { toast("A cash sale must be fully paid. Add a customer to put the balance on their account.", "due"); $("#b-cust").focus(); return; }
  if (!cid && cname) {
    const ex = findCustomerByName(cname);
    if (ex) cid = ex.id;
    else { const c = {id: uid(), name: cname, phone: "", level: draft.level, opening: 0, address: "", createdAt: Date.now()}; await put("c", c); cid = c.id; }
  }
  const old = draft.id ? S.invoices[draft.id] : null;
  const inv = {
    id: draft.id || uid(), no: draft.no ?? nextNo(), date: draft.date || today(),
    customerId: cid || null, customerName: cid ? S.customers[cid].name : "Cash sale", level: draft.level,
    items: rows.map(r => ({productId: r.productId, name: r.name.trim(), qty: r2(num(r.qty)), unit: r.unit || "", rate: r2(num(r.rate)), amount: r2(num(r.qty) * num(r.rate))})),
    subtotal: t.sub, discount: t.disc, total: t.total, received: t.received, mode: draft.mode, note: draft.note.trim(),
    createdAt: old ? old.createdAt : Date.now(), updatedAt: Date.now()
  };
  $("#b-save").disabled = true; $("#b-save-share").disabled = true;
  await put("i", inv);
  toast(`Bill ${invLabel(inv)} saved · ${money(inv.total)}`);
  draft = newDraft(); renderBill();
  if (share) viewInvoice(inv.id);
  else { const el = $(".it-name"); el && el.focus(); }
}
function focusRow(r, cls) { const el = $(`tr[data-key="${r.key}"] .${cls}`); el && (el.focus(), el.select && el.select()); }

function editInvoice(id) {
  const inv = S.invoices[id]; if (!inv) return;
  draft = {id: inv.id, no: inv.no, date: inv.date, customerId: inv.customerId, customerName: inv.customerId ? (S.customers[inv.customerId]?.name || inv.customerName) : "",
    level: inv.level || levels()[0], rows: inv.items.map(it => ({key: uid(), productId: it.productId, name: it.name, qty: String(it.qty), unit: it.unit, rate: String(it.rate), rateEdited: true, flag: ""})),
    discount: inv.discount ? String(inv.discount) : "", received: String(inv.received), receivedTouched: true, mode: inv.mode || "Cash", note: inv.note || ""};
  closeModal();
  if (route() === "bill") renderBill(); else location.hash = "bill";
}

/* ---------- Gujarati list scanner ---------- */
function startScan() { $("#scan-file").value = ""; $("#scan-file").click(); }

function scanPrompt() {
  const catalog = Object.values(S.products).sort(byName).map(p => `${p.id} | ${p.name} | ${p.gu || ""} | ${p.unit || ""}`).join("\n");
  return `You read shopping lists for a retail shop in Gujarat, India. The photo shows a list of items, usually handwritten in Gujarati; it may mix Gujarati, Hindi and English words and may use Gujarati digits (૦૧૨૩૪૫૬૭૮૯).
For each item line, read the item name and the quantity.
Match each item to the shop's product list below when you are confident it is the same product (Gujarati names, spelling variants and common local names count as matches). If not confident, use null.

Product list (id | English name | Gujarati name | unit):
${catalog || "(no products yet)"}

Quantity rules: convert Gujarati digits to normal digits. ½ or અડધો = 0.5, પા or પાવ = 0.25, પોણો = 0.75, સવા = 1.25, દોઢ = 1.5, અઢી = 2.5. If no quantity is written, use 1. If grams are written for a product sold by kg, convert to kg (250 ગ્રામ = 0.25). Skip lines that are not items (dates, names, totals, scribbles).

Reply with JSON only, no other text:
{"items":[{"written":"the line as written, in its original script","english":"short English name of the item","product_id":"an id from the list, or null","qty":1,"unit":"kg, g, ltr, pc, pkt, or empty"}]}`;
}
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(b); });

/* Engine 1: Claude API with the shop's own key (best for handwriting) */
async function scanWithClaude(img, cfg, signal) {
  const data = await blobToB64(img);
  const media = img.type && /^image\/(jpeg|png|webp|gif)$/.test(img.type) ? img.type : "image/jpeg";
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal,
    headers: {"content-type": "application/json", "x-api-key": cfg.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"},
    body: JSON.stringify({model: cfg.model || "claude-sonnet-5-5", max_tokens: 4000, messages: [{role: "user", content: [
      {type: "image", source: {type: "base64", media_type: media, data}}, {type: "text", text: scanPrompt()}]}]})
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw {code: "api", message: (j.error && j.error.message) || ("HTTP " + r.status)};
  const text = (j.content || []).filter(c => c.type === "text").map(c => c.text).join("");
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a < 0 || b < a) throw {code: "nothing"};
  const res = JSON.parse(text.slice(a, b + 1));
  return Array.isArray(res.items) ? res.items : [];
}

/* Engine 2: free in-browser OCR (Tesseract, Gujarati + English). Works best on clear printed or neat handwriting. */
let tessLoading = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (!tessLoading) tessLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = res; s.onerror = () => { tessLoading = null; rej({code: "offline"}); };
    document.head.appendChild(s);
  });
  return tessLoading;
}
async function scanWithOCR(img, onStatus) {
  await loadTesseract();
  const worker = await Tesseract.createWorker("guj+eng", 1, {logger: m => { if (m.status && onStatus) onStatus(m.status === "recognizing text" ? `Reading text… ${Math.round((m.progress || 0) * 100)}%` : "Preparing Gujarati reader (first time downloads ~5 MB)…"); }});
  try { const {data} = await worker.recognize(img); return parseListText(data.text || ""); }
  finally { await worker.terminate(); }
}
const GU_DIGITS = "૦૧૨૩૪૫૬૭૮૯";
const FRAC_WORDS = {"અડધો": .5, "અડધા": .5, "અડધી": .5, "અર્ધો": .5, "પા": .25, "પાવ": .25, "પોણો": .75, "પોણા": .75, "સવા": 1.25, "દોઢ": 1.5, "અઢી": 2.5, "½": .5, "¼": .25, "¾": .75};
const UNIT_WORDS = [[/^(કિલો|કિ\.?ગ્રા\.?|કી\.?|કિ\.?|kg|kgs|kilo)$/i, "kg"], [/^(ગ્રામ|ગ્રા\.?|gm|gms|g|gram|grams)$/i, "g"], [/^(લીટર|લિટર|લી\.?|ltr|l|litre|liter)$/i, "ltr"], [/^(પેકેટ|પેકેટ્સ|પડીકું|પડીકા|pkt|packet)$/i, "pkt"], [/^(નંગ|pc|pcs|piece)$/i, "pc"], [/^(ડઝન|dozen|dz)$/i, "dozen"]];
function bigrams(s) { s = " " + s + " "; const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); } return m; }
function dice(a, b) {
  if (!a || !b) return 0; if (a === b) return 1;
  const A = bigrams(a), B = bigrams(b); let inter = 0, na = 0, nb = 0;
  A.forEach(v => na += v); B.forEach(v => nb += v);
  A.forEach((v, k) => { if (B.has(k)) inter += Math.min(v, B.get(k)); });
  return 2 * inter / (na + nb);
}
function bestProduct(name) {
  const q = name.toLowerCase().replace(/[^\p{L}\p{M}\s]/gu, "").trim(); if (!q) return null;
  let best = null, bs = 0;
  for (const p of Object.values(S.products)) {
    const cands = [(p.gu || "").toLowerCase(), (p.name || "").toLowerCase()].filter(Boolean);
    for (const c of cands) {
      let s = dice(q, c);
      if (c.length >= 2 && (q.includes(c) || c.includes(q))) s = Math.max(s, .8);
      if (s > bs) { bs = s; best = p; }
    }
  }
  return bs >= .5 ? best : null;
}
function parseListText(text) {
  const out = [];
  for (let raw of text.split(/\n+/)) {
    let line = raw.replace(/[૦-૯]/g, d => GU_DIGITS.indexOf(d)).replace(/[|_~*•·]/g, " ").trim();
    if (line.replace(/\s/g, "").length < 2) continue;
    line = line.replace(/^\s*\d{1,2}\s*[.)\-:]\s*/, "");          // serial numbers like "1." or "2)"
    let qty = null, unit = "";
    const fr = line.match(/(\d+)\s*\/\s*(\d+)/);
    if (fr && +fr[2]) { qty = +fr[1] / +fr[2]; line = line.replace(fr[0], " "); }
    const nm = line.match(/\d+(?:\.\d+)?/);
    if (qty === null && nm) { qty = parseFloat(nm[0]); line = line.replace(nm[0], " "); }
    const words = line.split(/\s+/).filter(Boolean), keep = [];
    let fracMul = null;
    for (const w of words) {
      const wc = w.replace(/[.,:;\-]+$/, "");
      if (FRAC_WORDS[wc] !== undefined) { fracMul = FRAC_WORDS[wc]; continue; }
      const u = UNIT_WORDS.find(([re]) => re.test(wc)); if (u) { unit = u[1]; continue; }
      keep.push(w);
    }
    if (qty === null) qty = fracMul ?? 1;
    else if (fracMul === 1.25 || fracMul === .25) qty = qty + fracMul - (fracMul === 1.25 ? 1 : 0); // "સવા 2" ≈ 2.25
    const name = keep.join(" ").replace(/[.,:;\-]+$/, "").trim();
    if (!name || !/[\p{L}]/u.test(name)) continue;
    const p = bestProduct(name);
    if (p && unit === "g" && /^kg$/i.test(p.unit || "")) { qty = qty / 1000; unit = "kg"; }
    out.push({written: raw.trim(), english: p ? "" : name, product_id: p ? p.id : null, qty: r2(qty) || 1, unit: unit || (p && p.unit) || ""});
  }
  return out;
}

$("#scan-file").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;

  const s = openModal(`<h3>Reading the list</h3><img class="scan-img" src="${url}" alt="Photo of the list"><div class="row" id="scan-status"><div class="spinner"></div><span id="scan-msg">${useAI ? "Claude is reading the Gujarati items and counts…" : "Reading the list on this device…"}</span></div>
    ${useAI ? "" : `<p class="hint">Using free on-device reading. For messy handwriting, add a Claude API key in Settings for much better results.</p>`}

  const ctrl = new AbortController();
  s.querySelector("#scan-cancel").onclick = () => { ctrl.abort(); closeModal(); };
  try {
    const img = await shrinkImage(file);

      : code === "offline" ? "Couldn't download the Gujarati reader. Check your internet connection and try again."
      : code === "nothing" ? "No items could be read from this photo. Try a sharper, well-lit photo with the whole list in frame."
      : "The list couldn't be read (" + (code || (err && err.message) || "error") + "). Try again with a clearer photo.";
    const st = $("#scan-status"); if (st) st.innerHTML = `<span style="color:var(--due)">${esc(msg)}</span>`;
    const c = $("#scan-cancel"); if (c) c.textContent = "Close";
  }
});
function shrinkImage(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const max = 1800, sc = Math.min(1, max / Math.max(img.width, img.height));
      if (sc === 1 && file.size < 2.5e6) { res(file); return; }
      const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), "image/jpeg", 0.88);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}

let salesRange = {preset: "month", from: "", to: ""};
function rangeDates() {
  const now = new Date(); const t = today();
  switch (salesRange.preset) {
    case "today": return [t, t];
    case "week": { const d = new Date(now); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return [dstr(d), t]; }
    case "month": return [dstr(new Date(now.getFullYear(), now.getMonth(), 1)), t];
    case "last": return [dstr(new Date(now.getFullYear(), now.getMonth() - 1, 1)), dstr(new Date(now.getFullYear(), now.getMonth(), 0))];
    case "all": return ["0000-01-01", "9999-12-31"];
    default: return [salesRange.from || t, salesRange.to || t];
  }
}

function renderSettings() {
  const s = S.settings;
  $("#view").innerHTML = `
  <h2>Settings</h2>
  <div class="grid2" style="align-items:start">
    <div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>Shop details (printed on invoices)</h3>
      <div class="field"><label for="st-name">Shop name</label><input id="st-name" value="${esc(s.shopName)}" placeholder="e.g. Shree Ganesh Kirana Stores"></div>
      <div class="field"><label for="st-addr">Address</label><input id="st-addr" value="${esc(s.address)}"></div>
      <div class="grid2"><div class="field"><label for="st-phone">Phone</label><input id="st-phone" value="${esc(s.phone)}"></div>
        <div class="field"><label for="st-gst">GSTIN (optional)</label><input id="st-gst" value="${esc(s.gstin)}"></div></div>
      <div class="grid2"><div class="field"><label for="st-prefix">Bill number prefix</label><input id="st-prefix" value="${esc(s.prefix)}"></div>
        <div class="field"><label for="st-foot">Invoice footer</label><input id="st-foot" value="${esc(s.footer)}"></div></div>
      <div><button class="btn primary" id="st-save">Save shop details</button></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Price lists</h3>
        <p class="muted" style="margin:0">Each product can have a different price in each list. Pick the list on a bill, or set a default list per customer.</p>
        <div id="lv-list" style="display:flex;flex-direction:column;gap:8px">
          ${s.levels.map((l, i) => `<div class="row" style="flex-wrap:nowrap"><input value="${esc(l)}" data-lv="${i}" aria-label="Price list ${i + 1} name">${s.levels.length > 1 ? `<button class="icon-btn" data-lvdel="${i}" aria-label="Remove ${esc(l)}" title="Remove">×</button>` : ""}</div>`).join("")}
        </div>
        <div class="row"><button class="btn small" id="lv-add">+ Add price list</button><button class="btn small primary" id="lv-save">Save price lists</button></div>
      </div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Backup</h3>
        <p class="muted" style="margin:0">Your data is saved in this browser on this device. Clearing browser data deletes it, so download a backup regularly. To move to another phone or computer, download a backup here and restore it there.</p>
        <div class="row">${canDownload ? `<button class="btn small" id="bk-dl">Download backup</button>` : ""}<button class="btn small" id="bk-up">Restore from backup</button></div>
      </div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Gujarati list scanner</h3>
        <p class="muted" style="margin:0">Without a key, lists are read for free on this device. That works for printed or neat lists. For handwritten lists, add a Claude API key from console.anthropic.com. Each scan then costs a small amount on your Anthropic account.</p>
        <div class="field"><label for="sc-key">Claude API key (optional)</label><input id="sc-key" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(scanCfg().key)}"></div>
        <div class="field"><label for="sc-model">Model</label><input id="sc-model" value="${esc(scanCfg().model)}"></div>
        <p class="hint">The key is stored only in this browser and is never included in backups. Anyone using this browser can use it, so don't add it on a shared computer.</p>
        <div class="row"><button class="btn small primary" id="sc-save">Save scanner settings</button>${scanCfg().key ? `<button class="btn small danger" id="sc-clear">Remove key</button>` : ""}</div>
      </div>
    </div>
  </div>`;
  $("#st-save").onclick = async () => {
    Object.assign(S.settings, {shopName: $("#st-name").value.trim(), address: $("#st-addr").value.trim(), phone: $("#st-phone").value.trim(), gstin: $("#st-gst").value.trim(), prefix: $("#st-prefix").value, footer: $("#st-foot").value.trim()});
    await putSettings(); toast("Shop details saved");
  };
  $("#lv-add").onclick = () => { $("#lv-list").insertAdjacentHTML("beforeend", `<div class="row" style="flex-wrap:nowrap"><input value="" data-lv="new" placeholder="e.g. Dealer" aria-label="New price list name"></div>`); $("#lv-list input:last-child").focus(); };
  $$("[data-lvdel]").forEach(b => b.onclick = async () => {
    const l = S.settings.levels[+b.dataset.lvdel];
    if (!(await askConfirm(`Remove the “${l}” price list? Prices saved for it stay on products but won't be used.`, "Remove"))) return;
    S.settings.levels = S.settings.levels.filter((_, i) => i !== +b.dataset.lvdel); await putSettings(); renderSettings();
  });
  $("#lv-save").onclick = async () => {
    const old = S.settings.levels; const next = []; const renames = [];
    $$("[data-lv]").forEach(inp => { const v = inp.value.trim(); if (!v) return; if (inp.dataset.lv !== "new") { const o = old[+inp.dataset.lv]; if (o !== v) renames.push([o, v]); } if (!next.includes(v)) next.push(v); });
    if (!next.length) { toast("Keep at least one price list.", "due"); return; }
    $("#lv-save").disabled = true;
    for (const [o, v] of renames) {
      for (const p of Object.values(S.products)) if (p.prices && o in p.prices) { const pr = {...p.prices, [v]: p.prices[o]}; delete pr[o]; await put("p", {...p, prices: pr}); }
      for (const c of Object.values(S.customers)) if (c.level === o) await put("c", {...c, level: v});
    }
    S.settings.levels = next; await putSettings(); toast("Price lists saved"); renderSettings();
  };
  const dl = $("#bk-dl"); if (dl) dl.onclick = () => offerDownload(`Dukaan backup ${today()}.json`, JSON.stringify({app: "dukaan-bill-book", version: 1, products: S.products, customers: S.customers, invoices: S.invoices, payments: S.payments, settings: S.settings}, null, 1));
  $("#sc-save").onclick = () => { saveScanCfg({key: $("#sc-key").value.trim(), model: $("#sc-model").value.trim() || "claude-sonnet-5-5"}); toast("Scanner settings saved"); renderSettings(); };
  const scc = $("#sc-clear"); if (scc) scc.onclick = () => { saveScanCfg({...scanCfg(), key: ""}); toast("API key removed"); renderSettings(); };
  $("#bk-up").onclick = () => { $("#restore-file").value = ""; $("#restore-file").click(); };
}
$("#restore-file").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch (err) { toast("That file isn't a valid backup.", "due"); return; }
  if (!d || d.app !== "dukaan-bill-book") { toast("That file isn't a backup from this app.", "due"); return; }
  const n = ["products", "customers", "invoices", "payments"].reduce((s, k) => s + Object.keys(d[k] || {}).length, 0);
  if (!(await askConfirm(`Restore ${n} records from this backup? Records with the same ID are replaced; nothing else is deleted.`, "Restore"))) return;
  toast("Restoring… keep this page open.");
  const kinds = {products: "p", customers: "c", invoices: "i", payments: "y"};
  for (const [k, kk] of Object.entries(kinds)) for (const v of Object.values(d[k] || {})) if (v && v.id) await put(kk, v);
  if (d.settings) { S.settings = {...DEFAULT_SETTINGS, ...d.settings}; await putSettings(); }
  toast(`Restored ${n} records`); renderRoute();
});

/* ---------- start ---------- */
initStore();
</script>
</body>
</html>
